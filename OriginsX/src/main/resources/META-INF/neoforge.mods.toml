modLoader = "javafml"
loaderVersion = "[4,)"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
description = "${mod_description}"
displayURL = "${mod_url}"
logoFile = "mod_icon.png"
authors = "dotnaccel"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neo_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "ldlib2"
type = "required"
versionRange = "[${ldlib2_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "raceapi"
type = "required"
versionRange = "[${raceapi_version},)"
ordering = "NONE"
side = "BOTH"

[[mixins]]
config = "originsx.mixins.json"
