name: build

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Build Race API (core)
        run: ./gradlew -p RaceAPI build --no-daemon --stacktrace

      - name: Stage Race API into satellite libs
        run: |
          set -e
          JAR=$(find RaceAPI/build/libs -maxdepth 1 -name '*.jar' \
                    ! -name '*sources*' ! -name '*javadoc*' ! -name '*dev*' | head -n1)
          echo "Staging $JAR"
          for d in OriginsX SkillTree Looks; do cp "$JAR" "$d/libs/"; done

      - name: Build satellites
        run: |
          ./gradlew -p OriginsX build --no-daemon --stacktrace
          ./gradlew -p SkillTree build --no-daemon --stacktrace
          ./gradlew -p Looks build --no-daemon --stacktrace

      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: originsx-jars
          path: |
            RaceAPI/build/libs/*.jar
            OriginsX/build/libs/*.jar
            SkillTree/build/libs/*.jar
            Looks/build/libs/*.jar

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download jars
        uses: actions/download-artifact@v4
        with:
          name: originsx-jars
          path: jars

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" jars/*.jar \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes