plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'net.neoforged.gradle.userdev' version '7.1.38'
}

version = mod_version
group = 'dev.originsx.skilltree'

base {
    archivesName = "${mod_name}-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        workingDirectory project.layout.projectDirectory.dir('run').dir(name)
        modSource project.sourceSets.main
    }

    client {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }

    server {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        argument '--nogui'
    }
}

repositories {
    mavenCentral()
    maven { url = "https://maven.firstdark.dev/snapshots" }
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"
    implementation "com.lowdragmc.ldlib2:ldlib2-neoforge-${minecraft_version}:${ldlib2_version}"
    // Race API as compileOnly — it is a separate mod installed alongside this addon
    compileOnly fileTree(dir: 'libs', include: '*.jar')
    // Fancy Tab Sections is OPTIONAL — compile-only. Sections are only registered
    // when the game detects the standalone "fancytabsections" mod (see
    // SkillTreeTabs.register); without it the plain creative tab still works.
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            "mod_id": mod_id,
            "version": version,
            "loader_version": loader_version,
            "minecraft_version": minecraft_version,
            "minecraft_version_range": minecraft_version_range,
            "neo_version": neo_version,
            "mod_license": mod_license,
            "mod_name": mod_name,
            "mod_description": mod_description,
            "mod_url": mod_url,
            "ldlib2_version": ldlib2_version,
            "raceapi_version": raceapi_version
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties + [project: project]
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
